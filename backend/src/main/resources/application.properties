spring.application.name=tech-store
spring.config.import=optional:file:.env[.properties]

# ================================================================
# SERVER / DEPLOYMENT
# ================================================================
# Railway (and most PaaS) assign the listen port via $PORT at runtime.
server.port=${PORT:8080}
# Comma-separated frontend origin(s) allowed to call this API cross-site
# (e.g. https://your-app.vercel.app). Defaults to the local Vite dev server.
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
# Cross-site cookies require SameSite=None + Secure (HTTPS only). Keep the
# local-dev defaults (Lax/not-secure) unless explicitly overridden in production.
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# ================================================================
# DATABASE
# ================================================================
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Supabase's session-mode pooler caps concurrent clients at 15 total across
# ALL connected apps (this local instance + the deployed Railway instance +
# anything else). Spring's HikariCP default (10 per instance) alone can blow
# past that once more than one instance is running, causing "max clients
# reached in session mode" and a cascading "Unable to determine Dialect"
# startup failure. Keep each instance's pool small enough that local dev and
# production can safely run at the same time.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

# ================================================================
# JPA / HIBERNATE
# ================================================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.engine.internal.StatisticalLoggingSessionEventListener=DEBUG
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ================================================================
# EMAIL / SMTP
# ================================================================
spring.mail.host=${EMAIL_SMTP_HOST}
spring.mail.port=${EMAIL_SMTP_PORT}
spring.mail.username=${EMAIL_SMTP_USER}
spring.mail.password=${EMAIL_SMTP_PASS}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=true

app.mail.from-name=${EMAIL_FROM_NAME}
app.mail.from-address=${EMAIL_FROM_ADDRESS}
app.mail.reply-to-mode=${EMAIL_REPLY_TO_MODE}
app.mail.reply-to-address=${EMAIL_REPLY_TO_ADDRESS}

# ================================================================
# JWT
# ================================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-ms=900000

# ================================================================
# USER & ACCOUNT MANAGEMENT
# ================================================================
server.servlet.session.timeout=30m
app.bootstrap-manager.email=${BOOTSTRAP_MANAGER_EMAIL:}
app.bootstrap-manager.password=${BOOTSTRAP_MANAGER_PASSWORD:}
app.bootstrap-manager.full-name=${BOOTSTRAP_MANAGER_FULL_NAME:System Manager}
app.bootstrap-manager.phone=${BOOTSTRAP_MANAGER_PHONE:0900000000}

# ================================================================
# PAYMENT — MOMO
# ================================================================
payment.momo.endpoint=${MOMO_ENDPOINT}
payment.momo.query-endpoint=${MOMO_QUERY_ENDPOINT:}
payment.momo.partner-code=${MOMO_PARTNER_CODE}
payment.momo.access-key=${MOMO_ACCESS_KEY}
payment.momo.secret-key=${MOMO_SECRET_KEY}
payment.momo.redirect-url=${MOMO_REDIRECT_URL}
payment.momo.ipn-url=${MOMO_IPN_URL}

# ================================================================
# PAYMENT — VNPAY
# ================================================================
payment.vnpay.payment-url=${VNPAY_PAYMENT_URL}
payment.vnpay.query-endpoint=${VNPAY_QUERY_ENDPOINT:}
payment.vnpay.tmn-code=${VNPAY_TMN_CODE}
payment.vnpay.hash-secret=${VNPAY_HASH_SECRET}
payment.vnpay.return-url=${VNPAY_RETURN_URL}
payment.vnpay.ipn-url=${VNPAY_IPN_URL}

# ================================================================
# RECOVERY — POSTGRES BIN
# ================================================================
# Leave blank when psql/pg_dump are already on PATH (e.g. installed via the
# backend's Dockerfile) — only set this if they live in a non-standard location.
app.recovery.postgres.bin-dir=${POSTGRES_BIN_DIR:}
app.recovery.storage-dir=${RECOVERY_STORAGE_DIR:recovery-storage}

# ================================================================
# FILE UPLOAD — PRODUCT IMAGES
# ================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
app.upload.product-images-dir=${PRODUCT_IMAGES_DIR:uploads/products}
# When the frontend is served from a different origin than this API (e.g. Vercel +
# Railway), image URLs must be absolute or the browser resolves them against the
# frontend's own domain. Set APP_PUBLIC_BASE_URL to this API's public URL in that
# case (e.g. https://your-backend.up.railway.app); left blank, URLs stay relative
# for local dev where the Vite proxy makes frontend/backend look same-origin.
app.upload.product-images-public-path=${APP_PUBLIC_BASE_URL:}/api/uploads/products

# ================================================================
# DEVTOOLS — PREVENT RESTARTS ON BACKUP FILES
# ================================================================
spring.devtools.restart.exclude=static/**,public/**,recovery-storage/**,uploads/**


